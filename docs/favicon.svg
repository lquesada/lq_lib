<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Minimal Dark Background -->
  <rect width="32" height="32" rx="8" fill="#0b0f19"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Minimalist LQ8 Glyphs -->
  <g fill="none" stroke-linejoin="round">
    <!-- Letter L (White) -->
    <path d="M 6.5,10.5 L 6.5,21.5 L 11,21.5" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Letter Q (White, same size/weight) -->
    <path d="M 18.8,18.8 L 21.2,21.2" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="15.5" cy="15.5" r="4.6" stroke="#f8fafc" stroke-width="2.2"/>

    <!-- Numeral 8 (Blue-ish Accent) -->
    <circle cx="25.5" cy="13" r="2.6" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="25.5" cy="18" r="3.2" stroke="#38bdf8" stroke-width="1.8"/>
  </g>
</svg>
